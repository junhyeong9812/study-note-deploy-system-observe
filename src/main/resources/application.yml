server:
  port: 17000
spring:
  application:
    name: observe
  threads:
    virtual:
      enabled: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}   # 로그 스트림이 있는 Redis
      timeout: 10s                                # 스트림 읽기의 대기(2초)보다 길게
observe:
  secret: ${OBSERVE_SECRET:}                      # 조회용 서버 간 비밀값 — 비어 있으면 전부 거절
  stream: ${OBSERVE_STREAM:logs}
  group: ${OBSERVE_GROUP:observe}
  db:
    url: ${OBSERVE_DB_URL:jdbc:postgresql://localhost:5432/observe}
    user: ${OBSERVE_DB_USER:observe}
    password: ${OBSERVE_DB_PASSWORD:}              # 비밀값 — 서버 .env 에만
  auth:                                            # 로그인 시도 잠금 — 기본값이 명세(연속 5회 실패 → 15분 잠금, 기록 90일)
    failure-limit: ${OBSERVE_AUTH_FAILURE_LIMIT:5}
    lock-duration: ${OBSERVE_AUTH_LOCK_DURATION:15m}
    retention: ${OBSERVE_AUTH_RETENTION:90d}
  metrics:                                         # 자원 지표 — agent 가 같은 Redis 의 이 스트림으로 보낸다
    stream: ${METRICS_STREAM:metrics}
    group: ${METRICS_GROUP:observe}
    expected-servers: ${METRICS_EXPECTED_SERVERS:}  # 쉼표로 나눈 서버 이름 — 한 번도 안 보낸 서버도 GET /metrics/latest 에 "수신 없음"으로
    rollup-interval-ms: ${METRICS_ROLLUP_INTERVAL_MS:60000}   # 5분 평균 바퀴의 간격
    judge-interval-ms: ${METRICS_JUDGE_INTERVAL_MS:30000}   # 임계값 판정 · 알림 보내기 바퀴의 간격
    # 임계값(선택 — 비우면 명세 기본값). 예: alert.memory-pct: ${METRICS_ALERT_MEMORY_PCT:90}. 키 목록은 ResourceThresholds 의 KDoc
    alert:
      silent-warm-up: ${METRICS_ALERT_SILENT_WARM_UP:3m}               # 끊김 판정은 뜬 지 이만큼 지나고 한 번 따라잡은 뒤부터(§15.1)
      silent-give-up-after: ${METRICS_ALERT_SILENT_GIVE_UP_AFTER:15m}  # 따라잡지 못해도 뜬 지 이만큼 지나면 판정한다
  visits:                                          # 방문 — front 가 같은 Redis 의 이 스트림으로 보낸다. 주소 원문은 visit_event 표에만(90일)
    stream: ${VISITS_STREAM:visits}
    group: ${VISITS_GROUP:observe}
    retention-cron: ${VISITS_RETENTION_CRON:0 40 3 * * *}   # 90일 삭제 — 서울 시각. '-'(끔)이면 뜨지 않는다(주소를 저장하므로 끌 수 없다)
    retention-batch-size: ${VISITS_RETENTION_BATCH_SIZE:5000}  # 90일 삭제의 한 문장이 지우는 줄 수의 상한(1 이상)
    retention-time-budget: ${VISITS_RETENTION_TIME_BUDGET:5m}  # 90일 삭제 한 번의 시간 예산 — 넘기면 멈추고 다음 실행이 잇는다(0 보다 길게)
  log-alerts:                                      # 로그 무수신 알림 — 둘 다 비면 판정이 꺼진다. 판정 주기는 metrics.judge-interval-ms
    services: ${LOG_ALERT_SERVICES:}                # <서비스>@<사는 서버>=<기준(분)> 을 쉼표로 — 기준은 1~360분
    all-threshold-minutes: ${LOG_ALERT_ALL_THRESHOLD_MINUTES:}   # 전체 스트림 한 줄의 기준(분) — 비면 감시하지 않는다
    patterns: ${LOG_ALERT_PATTERNS:}                # 로그 글자 규칙 — <이름>|<서비스>|<세기>|<글자> 를 ; 로(README "로그 글자 규칙"). 비면 꺼짐
    warm-up: ${LOG_ALERT_WARM_UP:3m}                # 판정은 뜬 지 이만큼 지나고 로그 수집의 마지막 바퀴가 따라잡은 바퀴일 때만(밀린 동안은 보류 — 포기하지 않는다)
  alert:                                           # 알림 서버 POST /events — 비우면 보내지 않고 못 보낸 알림으로 남는다
    events-url: ${ALERT_EVENTS_URL:}
    secret: ${ALERT_SECRET:}
    timeout-ms: ${ALERT_TIMEOUT_MS:3000}
    dispatch-interval-ms: ${ALERT_DISPATCH_INTERVAL_MS:30000}   # 알림 보내기 바퀴의 간격 — 판정과 따로 돈다
